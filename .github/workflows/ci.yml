name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b99b95fe68a59b538c35c50 diehard" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Grant permissions for Android SDK
        run: chmod -R 777 $ANDROID_HOME

      - name: Build with Gradle
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd /storage/emulated/0/Android/data/com.androidharness.app/files/workspace/power-rangers-tw
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /storage/emulated/0/Android/data/com.androidharness.app/files/workspace/power-rangers-tw/app/build/outputs/apk/debug/*.apk
